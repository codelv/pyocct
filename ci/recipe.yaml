context: {}
package:

  name: pyocct
  version: 7.9.1

source:
  path: ../

build:
  number: 104

requirements:
  build:
    - '{{ compiler("cxx") }}'
    - cmake
    - ninja
    - rapidjson
    - python
    - setuptools

  host:
    - python
    - pybind11
    - occt ==7.9.1
    - sel(linux): wayland
    - setuptools

  run:
    - python
    - occt ==7.9.1

test:
  source_files:
    - test

about:
  home: https://github.com/trelau/pyOCCT
  license: LGPL2.1
  license_family: LGPL
  summary: Python bindings for OpenCASCADE.
  description: Python bindings for OpenCASCADE geometry kernel.

